name: (2) Build and Deploy Smart-Media

on:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: log-in-docker-hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ./app/
        push: true
        tags: ${{ vars.DOCKERHUB_USER }}/smart-media:latest

  package-lambda:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: 3.12
    
    - name: prepare-packages
      run: |
        bash scripts/lambda_ingest/build_lambda.sh

  apply-infra:
    needs: [ package-lambda ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: setup-terraform
      uses: hashicorp/setup-terraform@v3

    - name: authenticate-to-aws
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: acquire-be-config
      run: |
        aws s3 cp s3://${{ vars.AWS_STATIC_BUCKET }}/terraform/backend/backend.config ./terraform/environments/dev/backend.config

    - name: init-and-validate
      working-directory: terraform/environments/dev/
      run: |
        terraform init -backend-config=backend.config
        terraform validate

    - name: apply
      working-directory: terraform/environments/dev/
      run: |
        terraform apply -auto-approve \
          -var="plat_name=smart-media" \
          -var="env=dev" \
          -var="eks_svc_acc_name=smart-media-cluster-svc-acc" \
          -var="user_ip=${{ vars.USER_IP_ADDRESS }}"
        terraform output -json > tf-outputs.json

    - name: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: tf-outputs
        path: ./terraform/environments/dev/tf-outputs.json

  deploy-app:
    runs-on: ubuntu-latest
    needs: [ build-app, apply-infra ]
    steps:
    - uses: actions/checkout@v4

    - name: download-artifact
      uses: actions/download-artifact@v4
      with:
        name: tf-outputs

    - name: authenticate-to-aws
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        
    - name: extract-params
      id: extract
      run: |
        vpc_id=$(jq -r '.vpc_id.value' tf-outputs.json)
        echo "vpc_id=$vpc_id" >> "$GITHUB_OUTPUT"

        cluster_name=$(jq -r '.cluster_name.value' tf-outputs.json)
        echo "cluster_name=$cluster_name" >> "$GITHUB_OUTPUT"

        aws_account_id=$(aws sts get-caller-identity --query Account --output text)
        echo "aws_account_id=$aws_account_id" >> "$GITHUB_OUTPUT"

        svc_acc_annot=$(jq -r '.eks_irsa_role_arn.value' tf-outputs.json)
        echo "svc_acc_annot=$svc_acc_annot" >> "$GITHUB_OUTPUT"

    - name: set-up-kubeconfig-for-eks
      run: |
        aws eks update-kubeconfig \
          --region ${{ vars.AWS_REGION }} \
          --name ${{ steps.extract.outputs.cluster_name }}
        
    - name: install-remote
      run: |
        helm upgrade -i aws-load-balancer-controller eks/aws-load-balancer-controller \
          --namespace kube-system \
          --set clusterName=${{ steps.extract.outputs.cluster_name }} \
          --set serviceAccount.create=true \
          --set serviceAccount.name=aws-load-balancer-controller \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="arn:aws:iam::${{ steps.extract.outputs.aws_account_id }}:role/alb-controller-role" \
          --set region=${{ vars.AWS_REGION }} \
          --set vpcId=${{ steps.extract.outputs.vpc_id }}

    - name: deploy-helm-chart
      run: |
        helm upgrade -i smart-media ./helm-charts/smart-media \
          --set image.repository=${{ vars.DOCKERHUB_USER }}/smart-media \
          # --set env.kinesisStreamName=${{ steps.extract.outputs.kinesis_stream_name }} \
          # --set env.dynamoDbStatusTable=${{ steps.extract.outputs.dynamodb_status_table }} \
          # --set env.s3MediaTable=${{ steps.extract.outputs.s3_media_table }} \
          --set env.logfireUrl=${{ vars.LOGFIRE_URL }} \
          --set env.logfireProjectName=${{ vars.LOGFIRE_PROJECT_NAME }} \
          --set secrets.logfireApiToken=${{ secrets.LOGFIRE_API_KEY}} \
          --set serviceAccount.name=${{ steps.extract.outputs.svc_acc_name }} \
          --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{steps.extract.outputs.svc_acc_annot}}
