    - name: install-alb-controller-through-bastion
      shell: bash
      continue-on-error: true
      run: |  
        set +e

        # Capture command id
        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --instance-ids ${{ steps.extract.outputs.bastion_id }} \
          --comment "install ALB Controller into helm" \
          --parameters commands=["../local/src/bootstrap/eks-alb-controller.sh"] \
          --region ${{ vars.AWS_REGION }} \
          --query "Command.CommandId" \
          --output text)

        echo "Command (ID="$COMMAND_ID") submitted to bastion host. Waiting for completion..."

        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id ${{ steps.extract.outputs.bastion_id }} \
          --region ${{ vars.AWS_REGION }}
        WAIT_STATUS=$?

        # set -e

        # Wait until command is executed
        if [[ "$WAIT_STATUS" -eq 0 ]]; then
          # Get output 
          echo "✅ Command succeeded. Fetching command output from bastion..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ steps.extract.outputs.bastion_id }} \
            --region ${{ vars.AWS_REGION }} \
            --output text \
            --query "StandardOutputContent"

        else
          # Get error(s)
          echo "❌ Command failed. Fetching error output (if any) from bastion..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ steps.extract.outputs.bastion_id }} \
            --region ${{ vars.AWS_REGION }} \
            --output text \
            --query "StandardErrorContent"
        fi

    - name: deploy-helm-chart-bastion
      shell: bash
      continue-on-error: true
      run: |
        set +e

        COMMAND_ID=$(aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --instance-ids ${{ steps.extract.outputs.bastion_id }} \
          --comment "deploy helm chart on EKS" \
          --parameters '{"commands":["../local/src/bootstrap/helm-deploy-eks.sh"]}' \
          --region ${{ vars.AWS_REGION }} \
          --query "Command.CommandId" \
          --output text)
        
        echo "Command (ID="$COMMAND_ID") submitted to bastion host. Waiting for completion..."

        aws ssm wait command-executed \
          --command-id "$COMMAND_ID" \
          --instance-id ${{ steps.extract.outputs.bastion_id }} \
          --region ${{ vars.AWS_REGION }}
        WAIT_STATUS=$?

        # set -e

        # Wait until command is executed
        if [[ "$WAIT_STATUS" -eq 0 ]]; then
          # Get output 
          echo "✅ Command succeeded. Fetching command output from bastion..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ steps.extract.outputs.bastion_id }} \
            --region ${{ vars.AWS_REGION }} \
            --output text \
            --query "StandardOutputContent"

        else
          # Get error(s)
          echo "❌ Command failed. Fetching error output (if any) from bastion..."
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id ${{ steps.extract.outputs.bastion_id }} \
            --region ${{ vars.AWS_REGION }} \
            --output text \
            --query "StandardErrorContent"
        fi
