name: (2) Build and Deploy Smart-Media

on:
  workflow_dispatch:

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: log-in-docker-hub
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ./app/
        push: true
        tags: ${{ vars.DOCKERHUB_USER }}/smart-media:latest
    
  upload-helm-charts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: authenticate-to-aws
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: package-charts
      run: |
        helm package ./helm-charts/smart-media

    - name: acquire-be-config
      run: |
        aws s3 cp smart-media-0.1.0.tgz s3://${{ vars.AWS_STATIC_BUCKET }}/helm/

  # package-lambda:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v4

  #   - uses: actions/setup-python@v5
  #     with:
  #       python-version: 3.12
    
  #   - name: prepare-packages
  #     run: |
  #       bash scripts/lambda_ingest/build_lambda.sh

  #   - uses: actions/upload-artifact@v4 
  #     with:
  #       name: lambda-ingest
  #       path: ./scripts/lambda_ingest/lambda_ingest.zip

  apply-infra:
    needs: [ upload-helm-charts ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: 3.12
    
    - name: prepare-packages
      run: |
        bash scripts/lambda_ingest/build_lambda.sh

    - name: setup-terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.7.5

    # - uses: actions/download-artifact@v4 
    #   with:
    #     name: lambda-ingest
    #     path: ./scripts/lambda_ingest/lambda_ingest.zip

    - name: authenticate-to-aws
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    - name: acquire-be-config
      run: |
        aws s3 cp s3://${{ vars.AWS_STATIC_BUCKET }}/terraform/backend/backend.config ./terraform/environments/dev/backend.config

    - name: init-and-validate
      working-directory: terraform/environments/dev/
      run: |
        terraform init -backend-config=backend.config
        terraform validate

    - name: apply
      working-directory: terraform/environments/dev/
      run: |
        terraform apply -auto-approve \
          -var="plat_name=smart-media" \
          -var="env=dev" \
          -var="eks_svc_acc_name=smart-media-cluster-svc-acc" \
          -var="user_ip=${{ vars.USER_IP_ADDRESS }}" \
          -var="s3_static_bucket=${{ vars.AWS_STATIC_BUCKET }}" \
          -var="logfire_url=${{ vars.LOGFIRE_URL }}" \
          -var="logfire_project_name=${{ vars.LOGFIRE_PROJECT_NAME }}" \
          -var="logfire_api_key=${{ secrets.LOGFIRE_API_KEY }}" \
          -var="dockerhub_user=${{ vars.DOCKERHUB_USER }}"
        terraform output -json > tf-outputs.json

        echo '### TerraForm Outputs:' >> $GITHUB_STEP_SUMMARY
        terraform output -json >> $GITHUB_STEP_SUMMARY

    - name: upload-artifact
      uses: actions/upload-artifact@v4
      with:
        name: tf-outputs
        path: ./terraform/environments/dev/tf-outputs.json

  deploy-app:
    runs-on: ubuntu-latest
    needs: [ build-app, apply-infra ]
    steps:
    - uses: actions/checkout@v4

    - name: download-artifact
      uses: actions/download-artifact@v4
      with:
        name: tf-outputs

    - name: authenticate-to-aws
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ vars.AWS_REGION }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        
    - name: extract-params
      id: extract
      run: |
        vpc_id=$(jq -r '.vpc_id.value' tf-outputs.json)
        echo "vpc_id=$vpc_id" >> "$GITHUB_OUTPUT"

        cluster_name=$(jq -r '.cluster_name.value' tf-outputs.json)
        echo "cluster_name=$cluster_name" >> "$GITHUB_OUTPUT"

        aws_account_id=$(aws sts get-caller-identity --query Account --output text)
        echo "aws_account_id=$aws_account_id" >> "$GITHUB_OUTPUT"

        svc_acc_annot=$(jq -r '.eks_irsa_role_arn.value' tf-outputs.json)
        echo "svc_acc_annot=$svc_acc_annot" >> "$GITHUB_OUTPUT"

        bastion_id=$(jq -r '.bastion_id.value' tf-outputs.json)
        echo "bastion_id=$bastion_id" >> "$GITHUB_OUTPUT"

        bastion_role_arn=$(jq -r '.bastion_role_arn.value' tf-outputs.json)
        echo "bastion_role_arn=$bastion_role_arn" >> "$GITHUB_OUTPUT"

        bastion_username=$(jq -r '.bastion_username.value' tf-outputs.json)
        echo "bastion_username=$bastion_username" >> "$GITHUB_OUTPUT"

        svc_acc_name=$(jq -r '.eks_svc_acc_name.value' tf-outputs.json)
        echo "svc_acc_name=$svc_acc_name" >> "$GITHUB_OUTPUT"

        dynamo_table=$(jq -r '.dynamodb_status_table.value' tf-outputs.json)
        echo "dynamo_table=$dynamo_table" >> "$GITHUB_OUTPUT"

        kds_stream_name=$(jq -r '.kinesis_stream_name.value' tf-outputs.json)
        echo "kds_stream_name=$kds_stream_name" >> "$GITHUB_OUTPUT"

        s3_media_bucket=$(jq -r '.s3_media_bucket.value' tf-outputs.json)
        echo "s3_media_bucket=$s3_media_bucket" >> "$GITHUB_OUTPUT"

    # - name: set-up-kubeconfig-for-eks
    #   run: |
    #     aws eks update-kubeconfig \
    #       --region ${{ vars.AWS_REGION }} \
    #       --name ${{ steps.extract.outputs.cluster_name }}

    - name: ensure-ssm-readiness
      run: |
        for i in {1..60}; do
          status=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ steps.extract.outputs.bastion_id }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --region ${{ vars.AWS_REGION }} \
            --output text)
          if [[ "$status" == "Online" ]]; then
            echo "SSM agent is online."
            break
          else
            echo "Waiting for SSM agent..."
            sleep 10
          fi
        done
    
    - name: Wait for EC2 to finish bootstrap (via SSM)
      run: |
        INSTANCE_ID=${{ steps.extract.outputs.bastion_id }}

        echo "Waiting for instance to be in running state..."
        aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID

        echo "Waiting for bootstrap_done signal..."
        while true; do
          STATUS=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Check if bootstrap complete" \
            --parameters commands="test -f /var/log/startup_done" \
            --query "Command.CommandId" --output text)

          sleep 10
          INVOCATION=$(aws ssm list-command-invocations \
            --command-id "$STATUS" \
            --details \
            --query "CommandInvocations[0].Status" --output text)

          if [[ "$INVOCATION" == "Success" ]]; then
            echo "Bastion is ready."
            break
          fi

          echo "Still waiting for bootstrap... (status: $INVOCATION)"
          sleep 15
        done


